engine: gemini
gemini:
  api_key: ''
  model: gemini-2.0-flash
local:
  endpoint: http://localhost:11434
  model: qwen2-vl:2b
  timeout: 30
interaction:
  default_mode: autopilot
  hotkey: <ctrl>+<alt>+c
  emergency_abort_key: esc
  mouse_shake_abort: true
audio:
  enabled: true
  rate: 175
  volume: 0.95
  voice_index: 0
  listen_timeout: 5
visual:
  ghost_cursor_color: '#00E5FF'
  pulse_ring_color: '#B388FF'
  highlight_box_color: '#00E676'
  text_color: '#FFFFFF'
  hud_bg: '#12141A'
  glow_radius: 36
  animation_fps: 60
